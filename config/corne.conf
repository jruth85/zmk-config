CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Mouse keys for the MOUS layer
CONFIG_ZMK_POINTING=y

# Bluetooth reliability (ZMK connection-issues docs). Flash both halves.
# 2M PHY off: helps Windows hosts with Intel/Realtek chips (e.g. "connected
# but not typing" after the PC wakes from sleep).
CONFIG_BT_CTLR_PHY_2M=n
# Max transmit power: better host and half-to-half links, negligible battery cost.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
