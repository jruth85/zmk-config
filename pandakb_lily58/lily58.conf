# PandaKB Lily58 (wireless, nice!nano + nice!view). Stock ZMK layout and stock
# nice!view screens. Used only by the lily58_pandakb_* builds (build.yaml points
# ZMK_CONFIG here). The nice!view CS-on-D0 fix comes from
# overlays/pandakb_corne_nice_view_cs.overlay (same PandaKB wiring).

# Deep sleep after 15 minutes idle (any key wakes it; that key isn't typed)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Wireless range, and 2M PHY off for Windows PCs with Intel/Realtek Bluetooth
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# ZMK Studio for realtime keymap changes
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
