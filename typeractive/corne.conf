# Typeractive choc Corne (sale build). Based on typeractivexyz/corne-wireless-view-zmk-config
# (MIT), with deep sleep on and 2M PHY off. Used only by the corne_typeractive_* builds
# (build.yaml points ZMK_CONFIG here); the PandaKB Corne uses config/.

# Deep sleep after 15 minutes idle (any key wakes it; that key isn't typed)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Increase the keyboard's wireless range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2M PHY off: helps Windows PCs with Intel/Realtek Bluetooth (ZMK connection-issues docs)
CONFIG_BT_CTLR_PHY_2M=n

# Eager debouncing
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=10

# ZMK Studio for realtime keymap updates
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
