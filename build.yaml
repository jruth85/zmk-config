# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano
#     shield: reviung41
#   - board: nice_nano
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  - board: nice_nano_v2
    shield: lily58_left nice_view_adapter nice_view_clouds
    snippet: studio-rpc-usb-uart
  - board: nice_nano_v2
    shield: lily58_right nice_view_adapter nice_view_clouds
  - board: nice_nano_v2
    shield: settings_reset
  # PandaKB Corne: nice!view CS on D0 (see overlays/)
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_clouds
    snippet: studio-rpc-usb-uart
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=${GITHUB_WORKSPACE}/overlays/pandakb_corne_nice_view_cs.overlay
    artifact-name: corne_pandakb_left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_clouds
    cmake-args: -DEXTRA_DTC_OVERLAY_FILE=${GITHUB_WORKSPACE}/overlays/pandakb_corne_nice_view_cs.overlay
    artifact-name: corne_pandakb_right
  # Typeractive choc Corne: stock nice!view wiring (CS on D1)
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_clouds
    snippet: studio-rpc-usb-uart
    artifact-name: corne_typeractive_left
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_clouds
    artifact-name: corne_typeractive_right
